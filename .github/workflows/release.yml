name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle CLI
        working-directory: packages/cli
        run: pnpm bundle

      - name: Rename artifact
        run: cp packages/cli/dist/tim.mjs tim

      - name: Compute SHA256
        id: sha
        run: |
          SHA=$(shasum -a 256 tim | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          VERSION="${TAG#v}"
          NOTES=$(printf '## Install via Homebrew\n\n```\nbrew tap todokr/homebrew-tap\nbrew install timothy\n```\n\n## Formula update (`todokr/homebrew-tap`)\n\n```ruby\nurl "https://github.com/todokr/timothy-cli/releases/download/%s/tim"\nsha256 "%s"\nversion "%s"\n```\n' "$TAG" "$SHA256" "$VERSION")
          gh release create "$TAG" tim --title "$TAG" --notes "$NOTES"
